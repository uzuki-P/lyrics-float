# Build the Windows EXE installer on a GitHub-hosted Windows runner.
# Compose's packageExe needs jpackage + WiX on Windows, so Linux can't build it.
# `just ci-exe` dispatches this workflow and downloads the artifact locally.
name: windows-exe

on:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: the version is 0.1.<commit count>.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and stage EXE
        run: ./gradlew stageExe

      - uses: actions/upload-artifact@v4
        with:
          name: lyrics-float-exe
          path: _apk/*.exe
          if-no-files-found: error
          retention-days: 7
