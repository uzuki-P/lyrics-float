# Build the Windows EXE installer on a GitHub-hosted Windows runner.
# Compose's packageExe needs jpackage + WiX on Windows, so Linux can't build it.
# Runs on every push to main that touches more than docs; ci-fetch.timer
# (dotconfig) downloads the artifact locally, and `just ci-exe` waits for it.
name: windows-exe

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", ".scratch/**"]
  workflow_dispatch:

# A newer push supersedes a build still in progress.
concurrency:
  group: windows-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exe:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      # Full history: the version is 0.1.<commit count>.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      # Staged names carry a local timestamp; the JVM reads the Windows
      # system zone, so set it to Asia/Jakarta before Gradle starts.
      - name: Set timezone
        run: tzutil /s "SE Asia Standard Time"

      - uses: gradle/actions/setup-gradle@v5

      - name: Build and stage EXE
        run: ./gradlew stageExe

      - uses: actions/upload-artifact@v7
        with:
          name: lyrics-float-exe
          path: _apk/*.exe
          if-no-files-found: error
          retention-days: 7
